name: docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 安装 doxygen / graphviz / 中文字体（系统包）
        run: |
          sudo apt-get update
          sudo apt-get install -y doxygen graphviz fonts-noto-cjk

      - name: npm ci
        run: npm ci

      - name: 生成文档（npm run docs → docs/doxygen/）
        run: npm run docs

      - name: 组装站点（仓库全部文件 + 生成的 docs，doxygen 输出作为站点根）
        run: |
          rm -rf _site
          mkdir -p _site
          tar --exclude=.git --exclude=node_modules --exclude=_site -cf - . | tar -xf - -C _site
          cp -r docs/doxygen/html/. _site/

      - name: 上传 Pages 产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4